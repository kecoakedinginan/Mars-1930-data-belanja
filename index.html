<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARS 1930 BELANJA</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #991b1b 100%);
            --primary-color: #dc2626;
            --primary-light: #fef2f2;
            --primary-shadow: rgba(220, 38, 38, 0.25);
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        /* Dynamic Theme Variables */
        [data-theme="red"] {
            --primary-gradient: linear-gradient(135deg, #f87171 0%, #dc2626 50%, #991b1b 100%);
            --primary-color: #dc2626;
            --primary-light: #fef2f2;
            --primary-shadow: rgba(220, 38, 38, 0.3);
        }
        [data-theme="blue"] {
            --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 50%, #1e40af 100%);
            --primary-color: #2563eb;
            --primary-light: #eff6ff;
            --primary-shadow: rgba(37, 99, 235, 0.3);
        }
        [data-theme="green"] {
            --primary-gradient: linear-gradient(135deg, #34d399 0%, #059669 50%, #064e3b 100%);
            --primary-color: #059669;
            --primary-light: #ecfdf5;
            --primary-shadow: rgba(5, 150, 105, 0.3);
        }
        [data-theme="purple"] {
            --primary-gradient: linear-gradient(135deg, #c084fc 0%, #7c3aed 50%, #4c1d95 100%);
            --primary-color: #7c3aed;
            --primary-light: #f5f3ff;
            --primary-shadow: rgba(124, 58, 237, 0.3);
        }
        [data-theme="dark"] {
            --primary-gradient: linear-gradient(135deg, #64748b 0%, #334155 50%, #0f172a 100%);
            --primary-color: #334155;
            --primary-light: #f8fafc;
            --primary-shadow: rgba(51, 65, 85, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px 12px 100px 12px;
            background-image: radial-gradient(at 0% 0%, rgba(255,255,255,0.8) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(200,200,255,0.1) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
        }

        /* Modern Gradient Header */
        .header {
            background: var(--primary-gradient);
            padding: 20px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px var(--primary-shadow);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            transition: all 0.3s ease;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        .btn-theme {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .btn-theme:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Card Container */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 16px;
        }

        /* Voice Mic Section */
        .voice-section {
            text-align: center;
            padding: 24px 12px;
        }

        .mic-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 8px 20px -2px var(--primary-shadow);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn:active {
            transform: scale(0.92);
        }

        .mic-btn.recording {
            animation: pulseGlow 1.5s infinite;
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .status-text {
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Forms UI */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .col {
            flex: 1;
        }

        .btn-add {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 16px -2px var(--primary-shadow);
            transition: all 0.2s ease;
        }

        .btn-add:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .timer-badge {
            display: none;
            background: #fffbebf5;
            color: #b45309;
            border: 1px solid #fde68a;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 14px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.1);
        }

        /* Table Design */
        .card-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 13px;
        }

        th {
            background: var(--primary-light);
            color: var(--primary-color);
            font-weight: 800;
            padding: 12px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #f1f5f9;
        }

        .text-right {
            text-align: right;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 8px;
            font-weight: 800;
            font-size: 16px;
            border-top: 2px dashed var(--border-color);
            margin-top: 12px;
            color: var(--text-main);
        }

        .grand-total-amount {
            color: var(--primary-color);
            font-size: 18px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: white;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .btn-action:active {
            transform: scale(0.97);
            background: #f8fafc;
        }

        .btn-danger {
            color: #ef4444;
            border-color: #fecaca;
            background: #fef2f2;
        }

        /* Theme Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 24px;
            width: 88%;
            max-width: 340px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 14px;
            cursor: pointer;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            font-weight: 600;
            font-size: 14px;
        }

        .theme-option:active {
            transform: scale(0.98);
            background: #f8fafc;
        }

        .theme-color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header dengan Gradasi Modern -->
    <div class="header">
        <h1>MARS 1930 BELANJA</h1>
        <button class="btn-theme" onclick="openThemeModal()">🎨 Warna UI</button>
    </div>

    <!-- Voice Control Card -->
    <div class="card voice-section">
        <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎙️</button>
        <div class="status-text" id="statusText">Tekan mikrofon untuk mulai bicara</div>
    </div>

    <!-- Input Form Card -->
    <div class="card">
        <div id="timerBadge" class="timer-badge">Auto-Simpan dalam <span id="countdown">4</span>s... (Tekan Mic untuk Batalkan)</div>
        
        <div class="form-group">
            <label>Tanggal</label>
            <input type="date" id="inputTanggal" class="form-control">
        </div>

        <div class="form-group">
            <label>Nama Barang / Item</label>
            <input type="text" id="inputItem" class="form-control" placeholder="Contoh: Beras 5kg">
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Qty / Jumlah</label>
                <input type="number" id="inputQty" class="form-control" placeholder="1" oninput="hitungTotalInput()">
            </div>
            <div class="col form-group">
                <label>Harga Satuan (Rp)</label>
                <input type="number" id="inputHarga" class="form-control" placeholder="15000" oninput="hitungTotalInput()">
            </div>
        </div>

        <div class="form-group">
            <label>Total Harga (Rp)</label>
            <input type="number" id="inputTotal" class="form-control" placeholder="0" readonly>
        </div>

        <button class="btn-add" onclick="tambahDataManual()">+ Tambah ke Tabel</button>
    </div>

    <!-- Data Table Card -->
    <div class="card">
        <div class="card-title">Daftar Belanja</div>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th class="text-right">Qty</th>
                        <th class="text-right">Harga</th>
                        <th class="text-right">Total</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tabelBody">
                    <!-- Data belanja diisi via script -->
                </tbody>
            </table>
        </div>

        <div class="total-box">
            <span>TOTAL BELANJA</span>
            <span class="grand-total-amount" id="grandTotal">Rp 0</span>
        </div>

        <div class="action-btns">
            <button class="btn-action" onclick="eksporCSV()">📥 Ekspor CSV</button>
            <button class="btn-action btn-danger" onclick="hapusSemua()">🗑️ Hapus Semua</button>
        </div>
    </div>
</div>

<!-- Modal Theme Switcher -->
<div class="modal" id="themeModal">
    <div class="modal-content">
        <h3 style="margin-bottom:16px; font-size:17px; font-weight:800;">Pilih Tema Warna</h3>
        
        <div class="theme-option" onclick="setTheme('red')">
            <div class="theme-color-dot" style="background: linear-gradient(135deg, #ef4444, #991b1b);"></div>
            <span>Merah Modern (Default)</span>
        </div>
        <div class="theme-option" onclick="setTheme('blue')">
            <div class="theme-color-dot" style="background: linear-gradient(135deg, #38bdf8, #1e40af);"></div>
            <span>Biru Sunset</span>
        </div>
        <div class="theme-option" onclick="setTheme('green')">
            <div class="theme-color-dot" style="background: linear-gradient(135deg, #34d399, #064e3b);"></div>
            <span>Hijau Fresh</span>
        </div>
        <div class="theme-option" onclick="setTheme('purple')">
            <div class="theme-color-dot" style="background: linear-gradient(135deg, #c084fc, #4c1d95);"></div>
            <span>Ungu Elegant</span>
        </div>
        <div class="theme-option" onclick="setTheme('dark')">
            <div class="theme-color-dot" style="background: linear-gradient(135deg, #64748b, #0f172a);"></div>
            <span>Dark Midnight</span>
        </div>

        <button class="btn-add" style="margin-top:14px; background: #64748b; box-shadow:none;" onclick="closeThemeModal()">Tutup</button>
    </div>
</div>

<script>
    let belanjaData = JSON.parse(localStorage.getItem('mars1930_belanja')) || [];
    let isRecording = false;
    let recognition = null;
    let autoSaveTimer = null;
    let countdownVal = 4;

    document.getElementById('inputTanggal').valueAsDate = new Date();

    const savedTheme = localStorage.getItem('mars1930_theme') || 'red';
    setTheme(savedTheme, false);

    function openThemeModal() { document.getElementById('themeModal').style.display = 'flex'; }
    function closeThemeModal() { document.getElementById('themeModal').style.display = 'none'; }
    
    function setTheme(themeName, save = true) {
        document.documentElement.setAttribute('data-theme', themeName);
        if(save) localStorage.setItem('mars1930_theme', themeName);
        closeThemeModal();
    }

    function renderTabel() {
        const tbody = document.getElementById('tabelBody');
        tbody.innerHTML = '';
        let total = 0;

        belanjaData.forEach((item, index) => {
            let rowTotal = item.qty * item.harga;
            total += rowTotal;
            tbody.innerHTML += `
                <tr>
                    <td><b>${item.item}</b><br><small style="color:#64748b">${item.tanggal}</small></td>
                    <td class="text-right">${item.qty}</td>
                    <td class="text-right">${item.harga.toLocaleString('id-ID')}</td>
                    <td class="text-right"><b>${rowTotal.toLocaleString('id-ID')}</b></td>
                    <td class="text-right"><button style="color:#ef4444; border:none; background:none; cursor:pointer; font-weight:bold; font-size:16px;" onclick="hapusItem(${index})">✕</button></td>
                </tr>
            `;
        });

        document.getElementById('grandTotal').innerText = 'Rp ' + total.toLocaleString('id-ID');
        localStorage.setItem('mars1930_belanja', JSON.stringify(belanjaData));
    }

    function hitungTotalInput() {
        let q = parseFloat(document.getElementById('inputQty').value) || 0;
        let h = parseFloat(document.getElementById('inputHarga').value) || 0;
        document.getElementById('inputTotal').value = q * h;
    }

    function tambahDataManual() {
        let tgl = document.getElementById('inputTanggal').value;
        let item = document.getElementById('inputItem').value.trim();
        let qty = parseFloat(document.getElementById('inputQty').value) || 1;
        let harga = parseFloat(document.getElementById('inputHarga').value) || 0;

        if(!item || harga <= 0) {
            alert('Mohon isi nama barang dan harga dengan benar!');
            return;
        }

        belanjaData.push({ tanggal: tgl, item: item, qty: qty, harga: harga });
        renderTabel();

        document.getElementById('inputItem').value = '';
        document.getElementById('inputQty').value = '';
        document.getElementById('inputHarga').value = '';
        document.getElementById('inputTotal').value = '';
        
        cancelAutoSave();
    }

    function hapusItem(index) {
        belanjaData.splice(index, 1);
        renderTabel();
    }

    function hapusSemua() {
        if(confirm('Hapus seluruh data belanjaan?')) {
            belanjaData = [];
            renderTabel();
        }
    }

    function eksporCSV() {
        if(belanjaData.length === 0) return alert('Data kosong!');
        let csv = 'Tanggal,Item,Qty,Harga,Total\n';
        belanjaData.forEach(d => {
            csv += `${d.tanggal},"${d.item}",${d.qty},${d.harga},${d.qty * d.harga}\n`;
        });
        let blob = new Blob([csv], { type: 'text/csv' });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Belanja_MARS1930_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
    }

    function parseSpokenPrice(text) {
        text = text.toLowerCase().replace(/rp|rupiah/g, '').trim();
        let wordMap = {
            'nol':0, 'satu':1, 'dua':2, 'tiga':3, 'empat':4, 'lima':5,
            'enam':6, 'tujuh':7, 'delapan':8, 'sembilan':9, 'sepuluh':10,
            'sebelas':11, 'seratus':100, 'seribu':1000
        };

        if(text.includes('rb') || text.includes('ribu')) {
            let clean = text.replace('ribu', '').replace('rb', '').trim();
            let val = parseFloat(clean) || wordMap[clean] || 0;
            return val * 1000;
        }
        if(text.includes('juta') || text.includes('jt')) {
            let clean = text.replace('juta', '').replace('jt', '').trim();
            let val = parseFloat(clean) || wordMap[clean] || 0;
            return val * 1000000;
        }
        
        return parseFloat(text.replace(/[^0-9]/g, '')) || 0;
    }

    function toggleVoice() {
        if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if(!recognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'id-ID';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = function() {
                    isRecording = true;
                    document.getElementById('micBtn').classList.add('recording');
                    document.getElementById('statusText').innerText = 'Mendengarkan... (Sebutkan: Barang, Jumlah, Harga)';
                    cancelAutoSave();
                };

                recognition.onresult = function(event) {
                    let transcript = event.results[0][0].transcript;
                    document.getElementById('statusText').innerText = `Terdengar: "${transcript}"`;
                    parseVoiceInput(transcript);
                };

                recognition.onerror = function() {
                    document.getElementById('statusText').innerText = 'Gagal mengenali suara. Coba lagi.';
                    stopVoice();
                };

                recognition.onend = function() {
                    stopVoice();
                };
            }

            if(isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        } else {
            alert('Browser Anda tidak mendukung Web Speech API.');
        }
    }

    function stopVoice() {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
    }

    function parseVoiceInput(text) {
        let parts = text.split('harga');
        let itemPart = parts[0] || '';
        let hargaPart = parts[1] || '';

        let qty = 1;
        let qtyMatch = itemPart.match(/(?:jumlah|qty|banyaknya)\s*(\d+)/i);
        if(qtyMatch) {
            qty = parseInt(qtyMatch[1]);
            itemPart = itemPart.replace(qtyMatch[0], '');
        }

        let itemNama = itemPart.trim();
        let hargaVal = parseSpokenPrice(hargaPart || text);

        if(itemNama) document.getElementById('inputItem').value = itemNama;
        document.getElementById('inputQty').value = qty;
        if(hargaVal > 0) document.getElementById('inputHarga').value = hargaVal;

        hitungTotalInput();
        startAutoSave();
    }

    function startAutoSave() {
        cancelAutoSave();
        countdownVal = 4;
        let badge = document.getElementById('timerBadge');
        let cdElem = document.getElementById('countdown');
        badge.style.display = 'block';
        cdElem.innerText = countdownVal;

        autoSaveTimer = setInterval(() => {
            countdownVal--;
            cdElem.innerText = countdownVal;
            if(countdownVal <= 0) {
                cancelAutoSave();
                tambahDataManual();
            }
        }, 1000);
    }

    function cancelAutoSave() {
        if(autoSaveTimer) {
            clearInterval(autoSaveTimer);
            autoSaveTimer = null;
        }
        document.getElementById('timerBadge').style.display = 'none';
    }

    renderTabel();
</script>

</body>
</html>
